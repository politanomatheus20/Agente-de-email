# PostgreSQL local para desenvolvimento: docker compose up -d
# DATABASE_URL=postgresql://postgres:postgres@localhost:5432/suporte_omnis
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suporte_omnis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
