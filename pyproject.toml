[project]
name = "suporte-omnis"
version = "1.0.0"
description = "Agente que atende os emails de suporte do Omnis"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]
# Textos em português usam acentos e travessões legítimos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omnis_support"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
